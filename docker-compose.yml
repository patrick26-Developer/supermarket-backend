services:
  postgres:
    image: postgres:16-alpine
    container_name: superette-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: superette_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: patrick123
    ports:
      # 5433 (pas 5432) : évite le conflit avec un service PostgreSQL natif
      # qui pourrait déjà écouter sur le port standard côté hôte (c'était le
      # cas en dev — voir docs/PROGRESS.md, entrée "bascule vers Docker").
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d superette_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8.6
    container_name: superette-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@superette.com
      PGADMIN_DEFAULT_PASSWORD: superette_admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data: